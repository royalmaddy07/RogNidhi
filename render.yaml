# Free-plan configuration for an initial API demo. See DEPLOYMENT.md for
# persistent uploads and AI memory requirements before production use.
services:
  - type: web
    name: rognidhi-backend
    runtime: python
    plan: free
    # Leave rootDir unset: backend imports the sibling ai/ package.
    buildCommand: bash backend/build.sh
    startCommand: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 180 --access-logfile - --error-logfile -
    healthCheckPath: /healthz/
    buildFilter:
      paths:
        - backend/**
        - ai/**
        - .python-version
        - render.yaml
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
